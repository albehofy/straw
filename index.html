      :root {
        --bg-dark: #0A0A0A;
        --surface: #0F0F0F;
        --accent-gold: #C5A059;
        --font-arabic: "IBM Plex Sans Arabic", sans-serif;
        --font-sans: "Inter", sans-serif;
      }

      * { box-sizing: border-box; }

      html {
        /* Prevent text from scaling below viewport */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        background-color: var(--bg-dark);
        color: #E0E0E0;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        min-width: 200px;
      }

      [dir="rtl"] { font-family: var(--font-arabic); letter-spacing: 0; }
      [dir="ltr"] { font-family: var(--font-sans); }

      /* ─── No-scrollbar ─────────────────────────── */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* ─── Mask helpers ─────────────────────────── */
      .mask-fade-edges {
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }
      .mask-fade-right { mask-image: linear-gradient(to right, black 80%, transparent); }
      [dir="rtl"] .mask-fade-right { mask-image: linear-gradient(to left, black 80%, transparent); }

      /* ─── Category active ──────────────────────── */
      .category-btn.active {
        background-color: var(--accent-gold) !important;
        color: black !important;
      }
      .menu-item-hover:hover .title-text { color: var(--accent-gold); }

      /* ═══════════════════════════════════════════
         ULTRA-NARROW BREAKPOINTS  (< 320px)
      ═══════════════════════════════════════════ */

      /* 200–319 px: hide S/L columns, show only M */
      @media (max-width: 319px) {
        .header-inner {
          padding-left: 8px !important;
          padding-right: 8px !important;
        }
        .app-logo { width: 32px !important; height: 32px !important; }
        .app-logo svg { width: 14px !important; height: 14px !important; }
        .app-title { font-size: 11px !important; }
        .app-subtitle { font-size: 6px !important; letter-spacing: 0.15em !important; }
        .lang-btn { padding: 5px 8px !important; font-size: 7px !important; gap: 4px !important; }
        .lang-btn svg { width: 8px !important; height: 8px !important; }
        .search-wrap { padding: 0 8px 10px !important; }
        #search-input { font-size: 8px !important; padding: 8px 8px 8px 32px !important; }
        .search-icon { left: 20px !important; width: 11px !important; height: 11px !important; }
        .cat-nav-wrap { padding: 0 8px 10px !important; gap: 6px !important; }
        .category-btn { padding: 5px 8px !important; font-size: 7px !important; letter-spacing: 0.1em !important; }

        /* Menu items: stack vertically */
        .menu-item-inner { flex-direction: column !important; align-items: flex-start !important; gap: 6px !important; }
        .price-col { justify-content: flex-start !important; gap: 10px !important; }
        /* Hide S and L price columns, show only M */
        .price-s, .price-l, .ph-s, .ph-l { display: none !important; }
        .price-m { color: var(--accent-gold) !important; font-weight: 700 !important; }
        .title-text { font-size: 12px !important; }
        .item-subtitle { font-size: 7px !important; }
        .price-val { width: 40px !important; font-size: 9px !important; }
        .cat-heading { font-size: 20px !important; }
        .cat-sub { font-size: 7px !important; }
        .trending-card { min-width: 110px !important; padding: 10px !important; }
        .trending-icon-wrap { padding: 8px !important; }
        .trending-icon-wrap svg { width: 14px !important; height: 14px !important; }
        .trending-name { font-size: 8px !important; }
        .trending-price { font-size: 9px !important; }
        .section-padding { padding-top: 3rem !important; }
        main { padding-left: 8px !important; padding-right: 8px !important; padding-top: 1.5rem !important; }
        footer { padding: 2rem 8px !important; }
        .footer-text { font-size: 8px !important; }
        .footer-body { font-size: 9px !important; }
        .trending-label { font-size: 7px !important; letter-spacing: 0.15em !important; }
      }

      /* 200–249 px: extra squeeze */
      @media (max-width: 249px) {
        .app-title { font-size: 9px !important; }
        .lang-btn span { display: none; }
        .lang-btn { padding: 5px 6px !important; }

        .price-col { gap: 6px !important; }
        .price-val { width: 32px !important; font-size: 8px !important; }
        .title-text { font-size: 11px !important; }

        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }

  document.body.className = isEn ? 'font-sans' : 'font-arabic';

  document.getElementById('app-title').textContent       = isEn ? 'COFFEE STRAW' : 'كوفي سترو';
  document.getElementById('app-subtitle').textContent    = isEn ? 'Boutique Roastery' : 'محمصة بوتيك';
  document.getElementById('lang-text').textContent       = isEn ? 'AR' : 'EN';
  document.getElementById('search-input').placeholder    = isEn ? 'FIND YOUR FAVORITE...' : 'ابحث في القائمة...';
  document.getElementById('trending-label').textContent  = isEn ? 'TRENDING SELECTION' : 'قائمة الرائج لدينا';
  document.getElementById('footer-gold-text').textContent = 'COFFEE STRAW';
  document.getElementById('footer-prices').textContent   = isEn ? 'ALL PRICES IN EGYPTIAN POUNDS (EGP)' : 'جميع الأسعار بالجنيه المصري (EGP)';
  document.getElementById('footer-reserved').innerHTML  = isEn
    ? `All Rights Reserved ${new Date().getFullYear()} © COFFEE STRAW`
    : `جميع الحقوق محفوظة ${new Date().getFullYear()} © كوفي سترو`;
  document.getElementById('footer-terms').textContent   = isEn
    ? 'Terms & Conditions apply. Prices include tax.'
    : 'تطبق الشروط والأحكام والأسعار شاملة الضريبة';

  renderCategories();
  renderTrending();
  renderMenu();
}

function renderCategories() {
  const container = document.getElementById('category-nav');
  container.innerHTML = MENU_DATA.map(cat => {
    const isActive = cat.category_en === activeCategory;
    return `
      <button
        onclick="scrollToCategory('${cat.category_en}')"
        class="category-btn whitespace-nowrap px-3 sm:px-5 py-2 sm:py-2.5 rounded-full text-[8px] sm:text-[10px] font-bold uppercase tracking-wider sm:tracking-widest transition-all duration-300 ${isActive ? 'active' : 'text-white/40 hover:text-white hover:bg-white/5'}"
      >${currentLang === 'en' ? cat.category_en : cat.category_ar}</button>
    `;
  }).join('');
}

function renderTrending() {
  const container = document.getElementById('trending-items');
  if (searchQuery) {
    document.getElementById('trending-section').classList.add('hidden');
    return;
  }
  document.getElementById('trending-section').classList.remove('hidden');

  const items = MENU_DATA[0].items.slice(0, 4);
  container.innerHTML = items.map(item => `
    <div class="trending-card min-w-[130px] sm:min-w-[140px] bg-white/5 border border-white/5 p-3 sm:p-4 rounded-2xl flex flex-col items-center text-center gap-2 sm:gap-3 group hover:border-accent-gold/30 transition-all">
      <div class="trending-icon-wrap p-2.5 sm:p-3 bg-accent-gold/10 rounded-full group-hover:scale-110 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>
      </div>
      <div class="space-y-0.5">
        <div class="trending-name text-[9px] sm:text-[10px] font-bold uppercase tracking-widest leading-tight">${currentLang === 'en' ? item.name_en : item.name_ar}</div>
        <div class="trending-price text-[9px] sm:text-[10px] font-mono text-accent-gold">${item.prices.M || item.prices.S} EGP</div>
      </div>
    </div>
  `).join('');
}

function renderMenu() {
  const container = document.getElementById('menu-content');
  const narrow = isUltraNarrow();

  const filteredData = MENU_DATA.map(cat => ({
    ...cat,
    items: cat.items.filter(item =>
      item.name_en.toLowerCase().includes(searchQuery.toLowerCase()) ||
      item.name_ar.includes(searchQuery)
    )
  })).filter(cat => cat.items.length > 0);

  if (filteredData.length === 0) {
    container.innerHTML = `
      <div class="py-16 sm:py-24 text-center space-y-4 sm:space-y-6">
        <div class="inline-flex p-6 sm:p-8 bg-white/5 rounded-full border border-white/5 opacity-20">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <p class="text-[9px] sm:text-[10px] font-bold uppercase tracking-[0.3em] sm:tracking-[0.4em] text-white/40">NO ITEMS FOUND</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filteredData.map(cat => {
    /* Always show all 3 columns — S, M, L — hiding S+L only on ultra-narrow */
    const showSL = !narrow;

    return `
    <section id="section-${cat.category_en}" class="menu-section section-padding space-y-6 sm:space-y-10 pt-16 sm:pt-20">
      <div class="flex items-end justify-between border-b border-white/5 pb-4 sm:pb-6">
        <div class="space-y-1 sm:space-y-2 min-w-0 flex-1 mr-2">
          <h3 class="cat-heading text-2xl sm:text-3xl font-serif italic text-white truncate">${currentLang === 'en' ? cat.category_en : cat.category_ar}</h3>
          <p class="cat-sub text-[7px] sm:text-[9px] font-bold tracking-[0.3em] sm:tracking-[0.4em] text-accent-gold uppercase opacity-60 truncate">
            ${currentLang === 'en' ? cat.category_ar : cat.category_en}
          </p>
        </div>
        <div class="flex gap-3 sm:gap-8 text-[8px] sm:text-[9px] font-bold text-white/30 uppercase tracking-[0.2em] sm:tracking-[0.3em] pb-1 price-header flex-shrink-0">
          ${showSL ? '<span class="ph-s w-6 sm:w-8 text-center">S</span>' : ''}
          <span class="ph-m w-6 sm:w-8 text-center">M</span>
          ${showSL ? '<span class="ph-l w-6 sm:w-8 text-center">L</span>' : ''}
        </div>
      </div>
      <div class="grid gap-6 sm:gap-10">
        ${cat.items.map(item => `
          <div class="group relative py-1 menu-item-hover">
            <div class="menu-item-inner flex justify-between items-center gap-3">
              <div class="flex flex-col gap-0.5 sm:gap-1.5 min-w-0 flex-1">
                <h4 class="title-text text-[12px] sm:text-[15px] font-medium text-white/90 transition-all duration-300 leading-snug">
                  ${currentLang === 'en' ? item.name_en : item.name_ar}
                </h4>
                <span class="item-subtitle text-[7px] sm:text-[9px] font-bold uppercase tracking-[0.15em] sm:tracking-[0.2em] text-white/20 leading-snug">
                  ${currentLang === 'en' ? item.name_ar : item.name_en}
                </span>
              </div>
              <div class="price-col flex gap-3 sm:gap-8 text-[10px] sm:text-[11px] font-mono items-center flex-shrink-0 ${currentLang === 'ar' ? 'flex-row-reverse' : ''}">
                ${showSL ? `<span class="price-s price-val w-6 sm:w-8 text-center ${item.prices.S ? 'text-white/60' : 'text-white/10 select-none'}">${item.prices.S || '—'}</span>` : ''}
                <span class="price-m price-val w-6 sm:w-8 text-center ${item.prices.M ? 'text-accent-gold font-bold' : 'text-white/10 select-none'}">${item.prices.M || '—'}</span>
                ${showSL ? `<span class="price-l price-val w-6 sm:w-8 text-center ${item.prices.L ? 'text-white/60' : 'text-white/10 select-none'}">${item.prices.L || '—'}</span>` : ''}
              </div>
            </div>
            <div class="absolute bottom-[-0.75rem] left-0 right-0 h-[1px] bg-white/5 group-hover:bg-accent-gold/20 transition-colors"></div>
          </div>
        `).join('')}
      </div>
    </section>
  `}).join('');
}

window.scrollToCategory = (id) => {
  const el = document.getElementById(`section-${id}`);
  if (!el) return;
  const offset = 180;
  const bodyRect = document.body.getBoundingClientRect().top;
  const elementRect = el.getBoundingClientRect().top;
  window.scrollTo({ top: elementRect - bodyRect - offset, behavior: 'smooth' });
};

document.getElementById('lang-toggle').addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  updateStaticUI();
});

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderTrending();
  renderMenu();
});

/* Scrollspy */
window.addEventListener('scroll', () => {
  const sections = document.querySelectorAll('.menu-section');
  let current = activeCategory;
  sections.forEach(section => {
    if (section.getBoundingClientRect().top <= 250) {
      current = section.id.replace('section-', '');
    }
  });
  if (current !== activeCategory) {
    activeCategory = current;
    renderCategories();
  }
}, { passive: true });

/* Re-render on resize so narrow-mode columns update */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderMenu, 150);
});

updateStaticUI();
    </script>
  </body>
</html>
